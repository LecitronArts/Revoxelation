[package]
name = "revoxelation"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1.16", features = ["derive"] }
dashmap = "6.1"
env_logger = "0.11"
egui = "0.28"
glam = { version = "0.30", features = ["bytemuck"] }
gpu-allocator = { version = "0.27", features = ["vulkan"] }
hecs = "0.10"
log = "0.4"
noise = "0.9"
rand = "0.9"
raw-window-handle = "0.6"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
winit = "0.29"

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
shaderc = "0.10.1"
