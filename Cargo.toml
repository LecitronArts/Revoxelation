[package]
name = "revoxelation"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1.16", features = ["derive"] }
env_logger = "0.11"
egui = "0.28"
glam = { version = "0.30", features = ["bytemuck"] }
gpu-allocator = { version = "0.27", features = ["vulkan"] }
meshopt = "0.2"
image = "0.25"
log = "0.4"
raw-window-handle = "0.6"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
shaderc = { version = "0.10.1", optional = true }
toml = "0.8"
winit = "0.29"

[features]
default = ["hot-reload"]
hot-reload = ["dep:shaderc"]

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
shaderc = "0.10.1"
